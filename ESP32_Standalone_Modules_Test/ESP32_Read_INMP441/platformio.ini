; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8v]
platform = espressif32
board = esp32-s3-n16r8v
framework = arduino
monitor_speed = 460800
upload_port = COM11

; Đồng bộ đường Serial với Patient Node Final.
; Board esp32-s3-n16r8v mặc định bật USB CDC, khiến Python có thể mở được
; COM11 nhưng firmware lại nghe lệnh R/S trên một cổng Serial khác.
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0

; Không để Serial Monitor tự tác động chân reset/boot của ESP32-S3.
monitor_rts = 0
monitor_dtr = 0
