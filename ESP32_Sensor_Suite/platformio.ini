; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -O2
    ; Chọn MỘT ví dụ mô-đun để chạy độc lập:
    ; 1=BMP280, 2=DHT22, 3=MAX30102, 4=MLX90614, 5=NEO-M8N,
    ; 6=SGP30, 7=SSD1306, 8=A7680C, 9=ST7735.
    -D SENSOR_SUITE_MODULE=7

; Các driver trong project chỉ dùng thư viện lõi đi kèm Arduino-ESP32:
; Arduino, Wire (I2C), SPI, HardwareSerial và FreeRTOS. Không cần lib_deps ngoài.
